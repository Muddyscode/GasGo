<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-labelledby="gasgoMarkTitle">
  <title id="gasgoMarkTitle">GasGo: delivery truck, cylinder, on the way</title>
