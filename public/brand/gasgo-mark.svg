  <!-- Motion dashes: dashing to the next drop -->
  <path d="M2.5 13.2h6.2M2.2 16.4h5.4M2.8 19.6h5.6" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M2.2 16.4h5.4" stroke="#FFDF22" stroke-width="1.7" stroke-linecap="round"/>
  <!-- Cylinder riding with the truck -->
  <rect x="10.2" y="5.4" width="3.2" height="3.2" rx="0.7" fill="#FFFFFF"/>
  <rect x="10.9" y="4.2" width="1.8" height="1.6" rx="0.4" fill="#0B1F14"/>
  <rect x="8.6" y="8" width="6.6" height="12.4" rx="3.2" fill="#FFFFFF"/>
  <path d="M10 13.6h3.8" stroke="#1CA350" stroke-width="1.15" stroke-linecap="round"/>
  <!-- Cargo -->
  <rect x="8.2" y="14.6" width="13.4" height="8.2" rx="1.6" fill="#FFFFFF"/>
  <rect x="8.2" y="18.4" width="13.4" height="1.35" fill="#FFDF22"/>
  <!-- Cab -->
  <path d="M21.2 12.4h5.6c.9 0 1.6.7 1.6 1.6v8.2h-8.4v-8.6c0-.7.5-1.2 1.2-1.2Z" fill="#FFFFFF"/>
  <path d="M22.4 13.8h4.1l.9 4.2H22.4V13.8Z" fill="#147A3E"/>
  <rect x="27.2" y="19.2" width="1.5" height="1.5" rx="0.3" fill="#FFDF22"/>
  <!-- Wheels -->
  <circle cx="12.4" cy="24.6" r="2.35" fill="#0B1F14"/>
  <circle cx="12.4" cy="24.6" r="1.05" fill="#FFDF22"/>
  <circle cx="24.2" cy="24.6" r="2.35" fill="#0B1F14"/>
  <circle cx="24.2" cy="24.6" r="1.05" fill="#FFDF22"/>
</svg>
